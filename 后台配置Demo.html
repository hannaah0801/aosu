<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glazero Admin · 商城内容配置 Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:#eef1f5;color:rgba(0,0,0,.88);padding:22px 18px 60px;line-height:1.5715;font-size:14px}
.wrap{max-width:1560px;margin:0 auto}
h1{font-size:22px;font-weight:700;color:#1B5A9E;margin-bottom:4px}
.sub{font-size:13px;color:#667;margin-bottom:14px}
.ctrls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e0e5ea;
border-radius:10px;padding:10px 14px;margin-bottom:16px}
.ctrls span.lb{font-size:12.5px;color:#5a636e;font-weight:600}
.seg{display:flex;border:1px solid #d3d9e0;border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:6px 12px;font-size:12.5px;background:#fff;border:0;cursor:pointer;color:#4a535e;font-weight:600}
.seg button+button{border-left:1px solid #d3d9e0}
.seg button.on{background:#1677ff;color:#fff}

/* ============ Admin 外壳 ============ */
.admin{display:flex;background:#fff;border-radius:8px;overflow:hidden;
box-shadow:0 6px 24px rgba(15,30,50,.12);border:1px solid #e8ebef;min-height:760px}
.rail{width:56px;background:#fff;border-right:1px solid #f0f0f0;padding-top:10px;flex:0 0 56px}
.rail .lg{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);
margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800}
.rail .ri{text-align:center;padding:10px 0;font-size:11px;color:rgba(0,0,0,.5)}
.rail .ri i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
.rail .ri.on{background:#1677ff;color:#fff}
.side{width:196px;border-right:1px solid #f0f0f0;flex:0 0 196px;padding:14px 0}
.side .ttl{font-size:16px;font-weight:700;padding:0 16px 14px}
.side .mi{padding:9px 16px;font-size:13.5px;color:rgba(0,0,0,.85);display:flex;align-items:center;gap:8px;cursor:pointer}
.side .mi i{font-style:normal;font-size:13px;color:rgba(0,0,0,.45)}
.side .mi .ar{margin-left:auto;font-size:10px;color:rgba(0,0,0,.35)}
.side .sub2{padding:8px 16px 8px 38px;font-size:13.5px;color:rgba(0,0,0,.85);cursor:pointer;position:relative}
.side .sub2:hover{background:#f5f5f5}
.side .sub2.on{background:#e6f4ff;color:#1677ff;font-weight:600}
.side .sub2.new{outline:1.5px solid #ff4d4f;outline-offset:-2px;border-radius:4px}
body.noann .side .sub2.new{outline:none}
.main{flex:1;min-width:0;background:#f5f7fa}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0;
font-size:13px;color:rgba(0,0,0,.65)}
.topbar .bc{display:flex;align-items:center;gap:6px}
.topbar .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px}
.topbar .pill{border:1px solid #d9d9d9;border-radius:6px;padding:3px 9px;display:flex;align-items:center;gap:5px}
.tabs{display:flex;gap:2px;padding:7px 12px 0;background:#fff;border-bottom:1px solid #f0f0f0}
.tabs .t{padding:5px 12px;font-size:13px;color:rgba(0,0,0,.7);border:1px solid #f0f0f0;border-bottom:0;
border-radius:6px 6px 0 0;background:#fafafa;display:flex;align-items:center;gap:7px}
.tabs .t.on{background:#fff;color:#1677ff;border-color:#e6e6e6}
.tabs .t s{text-decoration:none;color:rgba(0,0,0,.3);font-size:12px}
.body{padding:14px}
.card{background:#fff;border-radius:8px;padding:18px 20px}

/* ---- 表单条 ---- */
.filter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px}
.fi{display:flex;align-items:center;gap:8px}
.fi label{font-size:13.5px;color:rgba(0,0,0,.88);white-space:nowrap}
.inp{border:1px solid #d9d9d9;border-radius:6px;padding:5px 11px;font-size:13.5px;color:rgba(0,0,0,.35);
min-width:200px;background:#fff}
.inp.sel:after{content:"⌄";float:right;color:rgba(0,0,0,.25)}
.btn{border-radius:6px;padding:5px 15px;font-size:13.5px;cursor:pointer;border:1px solid #d9d9d9;background:#fff}
.btn.pri{background:#1677ff;border-color:#1677ff;color:#fff}
.btn.right{margin-left:auto}
.hdrbtns{display:flex;gap:10px;justify-content:flex-end;padding-bottom:14px}

/* ---- 表格 ---- */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:#fafafa;font-weight:600;padding:11px 12px;text-align:left;
border-bottom:1px solid #f0f0f0;color:rgba(0,0,0,.88);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid #f0f0f0;color:rgba(0,0,0,.88);vertical-align:middle}
table.t td.c,table.t th.c{text-align:center}
table.t tr:hover td{background:#fafafa}
.lk{color:#1677ff;cursor:pointer;margin-right:12px;font-size:13.5px}
.lk.dg{color:#ff4d4f}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid;line-height:20px}
.tag.g{color:#389e0d;border-color:#b7eb8f;background:#f6ffed}
.tag.o{color:#d46b08;border-color:#ffd591;background:#fff7e6}
.tag.r{color:#cf1322;border-color:#ffa39e;background:#fff1f0}
.tag.b{color:#0958d9;border-color:#91caff;background:#e6f4ff}
.tag.n{color:rgba(0,0,0,.45);border-color:#d9d9d9;background:#fafafa}
.newcol{background:#fffbe6!important;position:relative}
body.noann .newcol{background:transparent!important}
.pg{display:flex;align-items:center;gap:8px;padding-top:16px;font-size:13.5px;color:rgba(0,0,0,.65)}
.pg .n{border:1px solid #d9d9d9;border-radius:6px;min-width:30px;height:30px;display:flex;
align-items:center;justify-content:center;cursor:pointer;background:#fff}
.pg .n.on{border-color:#1677ff;color:#1677ff}
.pg .r{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ---- 编辑页 ---- */
.eh{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;margin-bottom:18px}
.eh .bk{color:#1677ff;cursor:pointer;font-size:13.5px}
.eh h3{font-size:16px;font-weight:600}
.sec{margin-bottom:22px}
.sec .st{font-size:14px;font-weight:600;padding-bottom:10px;display:flex;align-items:center;gap:8px}
.sec .st em{font-style:normal;font-size:12px;font-weight:400;color:rgba(0,0,0,.45)}
.row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.row .lab{width:96px;flex:0 0 96px;text-align:right;font-size:13.5px;color:rgba(0,0,0,.88);padding-top:5px}
.row .lab.req:before{content:"*";color:#ff4d4f;margin-right:3px}
.row .ctl{flex:1;min-width:0}
.tin{width:100%;border:1px solid #d9d9d9;border-radius:6px;padding:5px 11px;font-size:13.5px;background:#fff}
.tin.ph{color:rgba(0,0,0,.28)}
.cnt{font-size:12px;color:rgba(0,0,0,.45);text-align:right;margin-top:3px}
.cnt.over{color:#ff4d4f}
.up{width:104px;height:104px;border:1px dashed #d9d9d9;border-radius:8px;background:#fafafa;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
font-size:12px;color:rgba(0,0,0,.45)}
.up i{font-style:normal;font-size:20px;color:rgba(0,0,0,.3)}
.up.done{border-style:solid;border-color:#d9d9d9;background:linear-gradient(160deg,#AFC9E2,#7A9479);color:#fff;
position:relative;overflow:hidden}
.up.done b{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);font-size:11px;padding:3px;
font-weight:400;text-align:center}
.ups{display:flex;gap:14px;align-items:flex-start}
.upw{text-align:center}
.upw .cap{font-size:12px;color:rgba(0,0,0,.45);margin-top:6px}
.btabs{display:flex;gap:2px;border-bottom:1px solid #f0f0f0;margin-bottom:16px}
.btabs s{text-decoration:none;padding:8px 16px;font-size:13.5px;color:rgba(0,0,0,.88);cursor:pointer;
border-bottom:2px solid transparent}
.btabs s.on{color:#1677ff;border-bottom-color:#1677ff;font-weight:500}
.bi{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bi .ic{width:38px;flex:0 0 38px;border:1px solid #d9d9d9;border-radius:6px;padding:5px;text-align:center;background:#fff}
.bi .tx{flex:1}
.bi .del{color:#ff4d4f;cursor:pointer;font-size:13px;flex:0 0 auto}
.addb{border:1px dashed #d9d9d9;border-radius:6px;padding:6px;text-align:center;font-size:13.5px;
color:rgba(0,0,0,.45);cursor:pointer;background:#fafafa}
.foot{display:flex;gap:10px;padding-top:18px;border-top:1px solid #f0f0f0;margin-top:6px}
.warnbar{background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;padding:9px 12px;font-size:13px;
color:rgba(0,0,0,.7);margin-bottom:16px;display:flex;gap:8px}
.warnbar b{color:#d46b08}

/* ---- 标注 ---- */
.pin{position:absolute;z-index:20;width:20px;height:20px;border-radius:50%;background:#ff4d4f;color:#fff;
font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 6px rgba(255,77,79,.45);border:2px solid #fff}
body.noann .pin{display:none}
.rel{position:relative}

/* ---- 说明面板 ---- */
.panel{margin-top:16px}
.pc{background:#fff;border:1px solid #e2e7ec;border-radius:11px;margin-bottom:11px;overflow:hidden}
.pc h4{font-size:13.5px;font-weight:800;color:#16202b;padding:12px 15px 0}
table.p{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.p th{background:#F1F4F8;color:#4a535e;font-weight:800;padding:7px 12px;text-align:left;border:1px solid #E4E8ED}
table.p td{padding:7px 12px;border:1px solid #E9ECF0;color:#3a424c;vertical-align:top}
table.p td.u{font-weight:800;color:#16202b}
table.p td.n{text-align:center;font-weight:900;color:#ff4d4f;width:34px}
.why{font-size:12px;color:#6b737c;line-height:1.65;padding:11px 15px}
.why b{color:#1a2430}
.tip{font-size:12px;color:#525a64;background:#fff;border-left:3px solid #1B5A9E;
padding:11px 14px;border-radius:0 7px 7px 0;line-height:1.65;margin-bottom:10px}
.tip b{color:#1a2430}
.tip.rd{border-left-color:#C00000}
.tip.am{border-left-color:#D98800;background:#FFFCF6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Glazero Admin · 后台配置 Demo</h1>
  <div class="sub">在现有云商城后台上的改动：设备管理补一个字段（需求二）· 新增商城内容配置（需求三）· 营销规则配置沿用不改 · 红色圆点为改动点</div>

  <div class="ctrls">
    <span class="lb">页面</span>
    <div class="seg" id="sgView">
      <button data-v="pl" class="on">商城版本管理（新增）</button><button data-v="dev">设备管理</button>
      <button data-v="list">商城内容配置 · 列表</button>
      <button data-v="ea">编辑 · 实验组A</button>
      <button data-v="eb">编辑 · 实验组B</button><button data-v="rule">营销规则配置（沿用不改）</button>
    </div>
    <span class="lb">标注</span>
    <div class="seg" id="sgAnn"><button data-v="on" class="on">显示</button><button data-v="off">隐藏</button></div>
  </div>

  <!-- ==================== ADMIN ==================== -->
  <div class="admin">
    <div class="rail">
      <div class="lg">Glazero</div>
      <div class="ri"><i>⊞</i>首页</div>
      <div class="ri"><i>⚙</i>IoT</div>
      <div class="ri on"><i>🛒</i>云商城</div>
    </div>

    <div class="side">
      <div class="ttl">Glazero Admin</div>
      <div class="mi"><i>🛒</i>套餐商品管理<span class="ar">⌄</span></div>
      <div class="mi" data-go="rule" style="cursor:pointer"><i>◫</i>营销规则配置<span class="ar">⌄</span></div>
      <div class="mi"><i>▤</i>权益管理<span class="ar">⌃</span></div>
      <div class="sub2" data-go="dev">设备管理</div>
      <div class="sub2">设备权益矩阵</div>
      <div class="sub2">权益管理</div>
      <div class="sub2">物料管理</div>
      <div class="sub2">权益展示管理</div>
      <div class="rel"><div class="sub2 new" data-go="pl">商城版本管理<span class="pin" style="right:6px;top:6px">1</span></div></div>
      <div class="rel"><div class="sub2 new" data-go="list">商城内容配置<span class="pin" style="right:6px;top:6px">2</span></div></div>
      <div class="mi"><i>☁</i>云存管理<span class="ar">⌄</span></div>
      <div class="mi"><i>👤</i>用户套餐管理</div>
      <div class="mi"><i>📄</i>订单管理</div>
      <div class="mi"><i>🎟</i>兑换码管理</div>
    </div>

    <div class="main">
      <div class="topbar">
        <span>⟳</span>
        <div class="bc"><span>🛒 云商城</span><span>›</span><span>权益管理</span><span>›</span>
          <span id="bcLast" style="color:rgba(0,0,0,.88)">设备管理</span></div>
        <div class="rt">
          <span class="pill">🇨🇳 中国 ⌄</span><span class="pill">glazero ⌄</span>
          <span>🌙</span><span>文A</span><span>⛶</span>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="body"><div class="card" id="view"></div></div>
    </div>
  </div>

  <!-- ==================== 说明 ==================== -->
  <div class="panel" id="panel"></div>
</div>

<script>
/* ================= 视图 ================= */
const DEV_ROWS = [
 ["C2E","aosu","-","门铃","否","free 3 / basic 6 / pro 14 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["C2E2DA11","aosu","-","室内","否","free 3 / basic 8 / pro 17 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["C2E2D","aosu","1 组|H2E、H2EZ1","室内","否","free 3 / basic 8 / pro 12 / pre 0","free 3 / basic 6 / pro 14 / pre 19"],
 ["C2P","aosu","-","室内","否","free 3 / basic 5 / pro 9 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["C2PZ1","aosu","-","室内","否","free 3 / basic 5 / pro 8 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["V8S21","aosu","-","门铃","否","free 3 / basic 7 / pro 10 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["V8SZ2","aosu","-","门铃","否","free 3 / basic 7 / pro 10 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["V8P","aosu","-","门铃","否","free 3 / basic 8 / pro 16 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["V8PZ1","aosu","-","!!未填","否","free 3 / basic 8 / pro 16 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
 ["V8S","aosu","-","门铃","!!是","free 3 / basic 7 / pro 15 / pre 0","free 0 / basic 0 / pro 0 / pre 0"],
];

function devView(){
  return `
  <div class="hdrbtns"><span class="btn">?</span><span class="btn">刷新 S3</span><span class="btn pri">新增设备</span></div>
  <div class="filter">
    <div class="fi"><label>设备型号</label><div class="inp">请输入设备型号</div></div>
    <div class="fi"><label>所属渠道</label><div class="inp sel">请选择所属渠道</div></div>
    <div class="fi rel" style="margin-left:0">
      <label>产品线</label><div class="inp sel" style="min-width:150px">请选择产品线</div>
      <span class="pin" style="right:-8px;top:-8px">6</span></div>
    <div class="btn right">重 置</div><div class="btn pri">搜 索</div>
  </div>
  <table class="t"><tr>
    <th>设备型号</th><th>所属渠道</th><th>连接基站型号</th>
    <th class="newcol rel">产品线<span style="font-weight:400;color:rgba(0,0,0,.45);font-size:11px"> 只读</span><span class="pin" style="right:2px;top:2px">5</span></th>
    <th>权益</th><th>基站权益</th><th>更新时间</th><th>操作</th></tr>
  ${DEV_ROWS.map(r=>{
    const pl = r[3].startsWith("!!");
    const st = r[4].startsWith("!!");
    return `<tr>
    <td>${r[0]}</td><td>${r[1]}</td>
    <td>${r[2].split("|").map((x,i)=>i?`<div style="font-size:12px;color:rgba(0,0,0,.45)">${x}</div>`:x).join("")}</td>
    <td class="newcol">${pl?'<span class="tag r">未填</span>':'<span class="tag b">'+r[3]+'</span>'}</td>
    <td>${r[5]}<div style="color:#1677ff;font-size:12px;cursor:pointer">查看</div></td>
    <td style="color:${r[6].includes("pre 19")?"inherit":"rgba(0,0,0,.35)"}">${r[6]}
      <div style="color:${r[6].includes("pre 19")?"#1677ff":"rgba(0,0,0,.25)"};font-size:12px">查看</div></td>
    <td style="white-space:nowrap">2026-08-11 15:51:18</td>
    <td style="white-space:nowrap"><span class="lk">编辑</span><span class="lk">编辑权益</span><span class="lk">编辑基站权益</span><span class="lk dg">删除</span></td>
    </tr>`;}).join("")}
  </table>
  <div class="pg"><span>共 71 条记录</span><div class="inp sel" style="min-width:90px;color:rgba(0,0,0,.88)">10条/页</div>
    <div class="r"><span class="n">‹</span><span class="n on">1</span><span class="n">2</span><span class="n">3</span>
    <span class="n">4</span><span class="n">5</span><span class="n">›</span></div></div>`;
}

const PLANS = [
 ["实验组A 左右对比","V8S 专属","机型","done","1 / 1","2026-08-19 14:00"],
 ["实验组A 左右对比","C2E 专属","机型","done","1 / 1","2026-08-19 14:01"],
 ["实验组A 左右对比","门铃","产品线","done","1 / 1","2026-08-19 14:02"],
 ["实验组A 左右对比","室外","产品线","done","1 / 1","2026-08-19 14:05"],
 ["实验组A 左右对比","室内","产品线","done","1 / 1","2026-08-19 14:08"],
 ["实验组A 左右对比","兜底","兜底","none","0 / 1","—"],
 ["实验组B 三张静态图","V8S 专属","机型","part","8 / 12","2026-08-19 16:12"],
 ["实验组B 三张静态图","C2E 专属","机型","done","18 / 18","2026-08-19 16:15"],
 ["实验组B 三张静态图","门铃","产品线","part","8 / 12","2026-08-19 16:20"],
 ["实验组B 三张静态图","室外","产品线","part","12 / 18","2026-08-19 16:31"],
 ["实验组B 三张静态图","室内","产品线","done","12 / 12","2026-08-19 16:44"],
 ["实验组B 三张静态图","兜底","兜底","none","0 / 18","—"],
];
function listView(){
  return `
  <div class="warnbar rel"><b>⚠</b><div><b>兜底版尚未配置，实验不能开跑。</b>
    产品线未填、或内容缺失的设备都会落到兜底版，它是最后一道保障。
    <span class="pin" style="right:8px;top:8px">7</span></div></div>
  <div class="hdrbtns"><span class="btn">批量预览</span><span class="btn pri">新增配置</span></div>
  <div class="filter">
    <div class="fi"><label>实验组</label><div class="inp sel">全部</div></div>
    <div class="fi"><label>商城版本</label><div class="inp sel">全部</div></div>
    <div class="btn right">重 置</div><div class="btn pri">搜 索</div>
  </div>
  <table class="t"><tr>
    <th>实验组</th><th>商城版本</th><th class="c newcol rel">版本类型<span class="pin" style="right:2px;top:2px">15</span></th>
    <th class="c">内容状态</th><th class="c">素材</th><th>更新时间</th><th>操作</th></tr>
  ${PLANS.map(p=>{
    const st = p[3]==="done" ? '<span class="tag g">已配齐</span>'
            : p[3]==="part" ? '<span class="tag o">缺素材</span>'
